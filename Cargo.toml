[package]
name = "ice-rust-forecaster-poc"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = { version = "0.31", features = ["serialize"] }
base64 = "0.22"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rayon = "1.10"
