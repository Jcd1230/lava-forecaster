name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: lava-forecaster
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          include: README.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-wasm-assets:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust target
        run: rustup target add wasm32-unknown-unknown

      - name: Build WASM Packages
        run: |
          npx wasm-pack build --target bundler --out-dir pkg/bundler
          npx wasm-pack build --target web --out-dir pkg/web
          npx wasm-pack build --target nodejs --out-dir pkg/nodejs

      - name: Archive WASM Packages
        run: |
          tar -czvf lava-forecaster-wasm-bundler.tar.gz -C pkg/bundler .
          tar -czvf lava-forecaster-wasm-web.tar.gz -C pkg/web .
          tar -czvf lava-forecaster-wasm-nodejs.tar.gz -C pkg/nodejs .

      - name: Upload WASM Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lava-forecaster-wasm-bundler.tar.gz
            lava-forecaster-wasm-web.tar.gz
            lava-forecaster-wasm-nodejs.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
