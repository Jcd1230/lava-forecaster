[tools]
rust = "latest"
flatc = { version = "latest", exe = "flatc" }

[tasks.test]
description = "Run verification tests against Rust snapshots"
run = "cargo run --release --bin test_runner -- --run tests/cases"

[tasks.test-group]
description = "Run verification tests for one vaccine group"
run = "cargo run --release --bin test_runner -- --run tests/cases --group"

[tasks.test-compare]
description = "Compare outputs between Java ICE service and Rust POC"
run = "cargo run --release --bin test_runner -- --run tests/cases --compare"

[tasks.test-record]
description = "Record Java ICE output as the expected snapshot results"
run = "cargo run --release --bin test_runner -- --record tests/cases"

[tasks.scaffold]
description = "Scaffold a new vaccine group module and registration"
run = "bash scripts/scaffold_group.sh"
